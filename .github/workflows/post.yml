name: Liverpool Channel Auto Poster

on:
  schedule:
    - cron: '*/30 * * * *' # اجرا در هر ۳۰ دقیقه
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests google-genai

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Save posted links history
        run: |
          git config --global user.name "LFC Bot"
          git config --global user.email "bot@noreply.github.com"
          git add posted_links.json post_queue.json || true
          git diff --staged --quiet || git commit -m "Update posted news history and queue"
          git push
