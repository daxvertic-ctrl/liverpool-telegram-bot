name: Post Liverpool News

on:
  schedule:
    - cron: '0 */2 * * *'   # هر ۲ ساعت یک‌بار
  workflow_dispatch:        # امکان اجرای دستی

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4 deep-translator

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py

      - name: Commit seen posts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_posts.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen posts" && git push)
